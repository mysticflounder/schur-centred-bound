name: CI

# Builds the library, Challenge and Solution, then judges Solution against
# Challenge with the `lake comparator` of the project's own toolchain, the way
# the Palomar Registry does (scripts/verify-comparator.sh, from
# PalomarRegistry/PalomarTemplate @ 2891de4c48955af824969a263d31b25e7a9a1406).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    name: Build and check statements against the solution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
      - name: Install bubblewrap for lake comparator's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which `bwrap` needs for the sandbox; the runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the toolchain's lake comparator
        run: ./scripts/verify-comparator.sh
